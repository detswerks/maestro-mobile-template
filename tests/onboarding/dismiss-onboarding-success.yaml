appId: ${APP_ID}
tags:
  - smoke
  - onboarding
---
# 1. Load POM Locators
- runScript: ../../pom/index.js

# 2. Launch App with Clean State
- launchApp:
    clearState: true

# 3. Dismiss Initial Onboarding Flow
- runFlow: ../../steps/onboarding/dismiss-onboarding.yaml

# 4. Verify Arrival on Home Screen
- assertVisible:
    id: ${output.homeScreen.navTabHome}
- assertVisible:
    id: ${output.homeScreen.navTabSearch}
