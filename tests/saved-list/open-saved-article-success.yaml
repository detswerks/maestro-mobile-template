appId: ${APP_ID}
tags:
  - smoke
  - saved-list
  - article
---
# 1. Load Test Data & POM Locators
- runScript: ../../data/search-data.js
- runScript: ../../pom/index.js

# 2. Launch App with Clean State
- launchApp:
    clearState: true

# 3. Dismiss Initial Onboarding Flow (Fast Path)
- runFlow: ../../steps/onboarding/dismiss-onboarding.yaml

# 4. Prerequisite: Search for Article & Save to Reading List
- runFlow: ../../steps/navigation/open-search.yaml
- runFlow:
    file: ../../steps/search/search-and-select-article.yaml
    env:
      query: ${output.searchData.query}
      expectedTitle: ${output.searchData.expectedTitle}
- runFlow: ../../steps/article/save-article.yaml

# 5. Navigate to Saved List Screen
- runFlow: ../../steps/navigation/open-saved-list.yaml

# 6. Select Saved Article from List
- runFlow:
    file: ../../steps/saved-list/open-saved-article.yaml
    env:
      articleTitle: ${output.searchData.expectedTitle}

# 7. Final Assertions: Verify Article Detail Screen & Bookmark Action
- assertVisible:
    id: ${output.articleDetailScreen.pageSave}
- assertVisible:
    text: ${output.searchData.expectedTitle}
