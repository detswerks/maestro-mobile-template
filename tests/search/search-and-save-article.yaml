appId: ${APP_ID}
tags:
  - smoke
  - search
  - saved
commandTimeout: 10000
---
# 1. Load Data & POM Locators
- runScript: ../../data/search-data.js
- runScript: ../../pom/index.js

# 2. Mandatory Clean State Launch (Guarantees Test Isolation)
- launchApp:
    clearState: true

# 3. Prerequisite: Dismiss Onboarding & Land on Home
- runFlow: ../../steps/onboarding/dismiss-onboarding.yaml

# 4. Search & Open First Article Result
- runFlow:
    file: ../../steps/search/search-and-open-article.yaml
    env:
      query: ${output.searchData.query}
      articleTitleRegex: ${output.searchData.expectedArticleRegex}

# 5. Save Current Article
- runFlow: ../../steps/article/save-current-article.yaml

# 6. Navigate to Saved Articles & Verify Article Appears in Saved List
- runFlow: ../../steps/navigation/open-saved-list.yaml
- assertVisible: ${output.savedListScreen.tabAllArticles}
- assertVisible: ${output.searchData.expectedArticleRegex}
