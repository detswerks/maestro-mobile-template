# Reusable Action Step: Navigate to Saved Articles List
- runScript: ../../pom/article_detail.pom.js
- runScript: ../../pom/search.pom.js
- runScript: ../../pom/saved_list.pom.js

# Back out of Article Detail if currently open (use back since top toolbar auto-hides on scroll)
- runFlow:
    when:
      visible:
        id: ${output.articleDetailScreen.pageSave}
    commands:
      - back

# Back out of Custom Reading List Detail if currently open
- runFlow:
    when:
      visible:
        id: ${output.savedListScreen.readingListToolbar}
    commands:
      - tapOn: ${output.savedListScreen.btnNavigateUp}

# Back out of Active Search Input if currently open
- runFlow:
    when:
      visible:
        id: ${output.searchScreen.inputSearchSrcText}
    commands:
      - tapOn: ${output.searchScreen.btnNavigateUp}

# Tap Saved Bottom Navigation Tab
- tapOn:
    id: ${output.savedListScreen.navTabReadingLists}

# Anchor verification: Confirm arrival on Saved Articles screen
- assertVisible: ${output.savedListScreen.tabAllArticles}
