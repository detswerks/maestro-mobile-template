appId: ${APP_ID}
---
# Reusable Action Step: Dismiss Onboarding Flow and Verify Homepage
- runScript: ../../pom/onboarding.pom.js
- runScript: ../../pom/home.pom.js

# Slide 1 ("All the world's knowledge") -> Slide 2
- runFlow:
    when:
      visible: ${output.onboardingScreen.headerSlide1}
    commands:
      - tapOn: ${output.onboardingScreen.btnForward}

# Slide 2 ("Data & Privacy") -> Slide 3
- runFlow:
    when:
      visible: ${output.onboardingScreen.headerSlide2}
    commands:
      - tapOn: ${output.onboardingScreen.btnForward}

# Slide 3 ("Read in more than 300 languages") -> Slide 4
- runFlow:
    when:
      visible: ${output.onboardingScreen.headerSlide3}
    commands:
      - tapOn: ${output.onboardingScreen.btnForward}

# Slide 4 ("Follow your curiosity") -> Homepage (Skip personalization)
- runFlow:
    when:
      visible: ${output.onboardingScreen.btnSkip}
    commands:
      - tapOn: ${output.onboardingScreen.btnSkip}

# Anchor verification: Confirm arrival on Homepage
- assertVisible:
    id: ${output.homeScreen.navTabHome}
