# Reusable Action Step: Open Saved Article
# Selects a saved article from the Saved list screen

- runScript: ../../pom/saved_list.pom.js
- runScript: ../../pom/article_detail.pom.js

# Dismiss sync reading lists card if present to keep view clean
- runFlow:
    when:
      visible: ${output.savedListScreen.txtSyncPrompt}
    commands:
      - tapOn: ${output.savedListScreen.btnSyncNotNow}

# Tap on the saved article row matching title
- tapOn:
    containsChild:
      text: ^${articleTitle}$

# Anchor verification: Confirm arrival on Article Detail screen
- assertVisible:
    id: ${output.articleDetailScreen.pageSave}
